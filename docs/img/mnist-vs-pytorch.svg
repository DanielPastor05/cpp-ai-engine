<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-label="MNIST, same model and data, same machine"><rect width="760" height="270" fill="#fcfcfb"/><text x="20.0" y="26.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">MNIST, same model and data, same machine</text><text x="20.0" y="46.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781" text-anchor="start" font-weight="400">Ryzen 5 5500 (6 cores / 12 threads) + RTX 3060 Ti. 2 000 images, 12 epochs, fp32. Lower is better.</text><line x1="210.0" y1="88" x2="210.0" y2="240" stroke="#e1e0d9" stroke-width="1"/><text x="210.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums">0 s</text><line x1="325.0" y1="88" x2="325.0" y2="240" stroke="#e1e0d9" stroke-width="1"/><text x="325.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums">5 s</text><line x1="440.0" y1="88" x2="440.0" y2="240" stroke="#e1e0d9" stroke-width="1"/><text x="440.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums">10 s</text><line x1="555.0" y1="88" x2="555.0" y2="240" stroke="#e1e0d9" stroke-width="1"/><text x="555.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" style="font-variant-numeric:tabular-nums">15 s</text><line x1="670.0" y1="88" x2="670.0" y2="240" stroke="#e1e0d9" stroke-width="1"/><text x="670.0" y="256.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-siz